name: Feature idea
description: Something the app could do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like the app to do? What is the situation where you would use it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
