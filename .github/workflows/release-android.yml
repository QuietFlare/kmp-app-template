name: Release (Android)

# Ships a signed bundle to Play closed testing (alpha) via github.com/QuietFlare/ci-workflows.
# Triggers: an `android-v*` tag or a manual dispatch, never a branch push:
#   git tag android-v1.0.1 && git push --tags
# Re-runs shared-core tests, Android unit tests and lint on the tagged commit, then builds
# and uploads. Promotion to production is manual in the Play Console; the pipeline refuses
# that track. Play auth is keyless (Workload Identity Federation: GitHub's OIDC token is
# exchanged for short-lived Google credentials scoped to this repo; setup is in the
# pipeline's header comment).
#
# Before every tag, bump appVersionName and appVersionCode in androidApp/build.gradle.kts.
# F-Droid's Binaries URL is android-v%v/<slug>-%v-release.apk, so two tags with one
# versionName cannot both resolve, and Play rejects a repeated versionCode. The first
# upload of a new app cannot use the API; do it in the Play Console.
#
# Secrets (the first two are identifiers, kept as secrets so they stay masked in logs):
#   PLAY_WIF_PROVIDER     projects/NUM/locations/global/workloadIdentityPools/…
#   PLAY_SA_EMAIL         the service account's email
#   UPLOAD_KEYSTORE_B64   the upload keystore, base64 (base64 -i x.jks)
#   KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_ALIAS / KEYSTORE_KEY_PASSWORD

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  # The pipeline attaches the signed APK to a GitHub release on the tag; F-Droid
  # byte-compares it for reproducible builds.
  contents: write
  # Mints the OIDC token that Workload Identity Federation exchanges.
  id-token: write

jobs:
  release:
    uses: QuietFlare/ci-workflows/.github/workflows/play-release.yml@v1
    with:
      package-name: com.example.starter
      # The full pre-ship gate on the commit being uploaded.
      tasks: ':shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug'
      # Compile toolchain is JDK 21, matching F-Droid's builder (CLAUDE.md).
      java-version: '21'
      # Publishes the signed APK for F-Droid reproducible-build verification.
      apk-task: ':androidApp:assembleRelease'
    secrets:
      workload-identity-provider: ${{ secrets.PLAY_WIF_PROVIDER }}
      service-account: ${{ secrets.PLAY_SA_EMAIL }}
      upload-keystore-b64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      keystore-store-password: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      keystore-key-alias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      keystore-key-password: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
